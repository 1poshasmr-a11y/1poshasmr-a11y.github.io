<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 46" width="64" height="46" role="img" aria-label="Zero turn mower">
  <!-- A pictogram, not an illustration: open wheels and clear gaps so the
       silhouette still reads at 30px in the navbar. Nothing crosses into the
       rear wheel's opening, which is what keeps that hole clean. -->

  <!-- cutting deck, low and forward, with the side discharge chute -->
  <path d="M6 30 H30 v6 H8 a2 2 0 0 1 -2 -2 z" fill="#CC0000"/>
  <path d="M6 31 L2 34 v2 h4 z" fill="#CC0000"/>

  <!-- body: seat base, sitting down onto the deck -->
  <path d="M22 21 H40 v10 H22 z" fill="#CC0000"/>
  <!-- backrest: wide enough to read as a seat rather than a third lever -->
  <rect x="32" y="9" width="8" height="13" rx="3" fill="#CC0000"/>

  <!-- twin lap bars, set well forward of the seat -->
  <path d="M22 22 L16.5 7" stroke="#CC0000" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M26.5 22 L21 7" stroke="#CC0000" stroke-width="2.8" stroke-linecap="round"/>

  <!-- open wheels give the icon its air -->
  <circle cx="10" cy="36" r="4.4" fill="none" stroke="#CC0000" stroke-width="3"/>
  <circle cx="48" cy="31" r="9" fill="none" stroke="#CC0000" stroke-width="4.6"/>
</svg>
